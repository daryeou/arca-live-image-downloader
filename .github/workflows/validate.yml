name: Validate extension

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/test-validate-extension.js
      - run: node tools/test-media-utils.js
      - run: node tools/test-twitter-api.js
      - run: node tools/validate-extension.js
